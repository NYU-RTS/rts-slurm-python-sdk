[project]
name = "slurm-rest-api-client"
version = "0.0.1"
description = "A client library for accessing Slurm REST API"
authors = []
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "httpx2>=2.5.0",
    "attrs>=22.2.0",
]

[tool.uv.build-backend]
module-name = "slurm_rest_api_client"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
